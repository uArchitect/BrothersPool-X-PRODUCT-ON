name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Manuel çalıştırma seçeneği2333

jobs:
  deploy:
    name: Deploy to cPanel via FTP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Clean up invalid submodule references
        run: |
          # Remove invalid submodule references to prevent cleanup errors
          git config --file .git/config --get-regexp '^submodule\..*\.path$' 2>/dev/null | while read key path; do
            if [ ! -f .gitmodules ] || ! grep -q "path = $path" .gitmodules 2>/dev/null; then
              submodule_name=$(echo "$key" | sed 's/^submodule\.\(.*\)\.path$/\1/')
              echo "Removing invalid submodule reference: $submodule_name ($path)"
              git config --file .git/config --remove-section "submodule.$submodule_name" 2>/dev/null || true
            fi
          done || true

      - name: Delete old files from server
        run: |
          apt-get update && apt-get install -y lftp
          lftp -c "
          set ftp:ssl-allow no;
          open -u developer@brothersbaro.com,uqurcan0302 ftp.brothersbaro.com;
          cd /public_html/pool/resources/views;
          rm -f warehouses.blade.php;
          quit
          " || echo "File may not exist, continuing..."

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftp.brothersbaro.com
          username: developer@brothersbaro.com
          password: uqurcan0302
          protocol: ftp
          server-dir: /public_html/pool/
          dangerous-clean-slate: false
          dry-run: false
          log-level: verbose
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            **/storage/logs/**
            **/storage/pail/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/bootstrap/cache/**
            **/.github/**
            **/.env*
            **/.env.*
            **/*.log
            **/*.md
            **/*.zip
            **/*.tar.gz
            **/*.rar
            **/package*.json
            **/yarn.lock
            **/.npm/**
            **/.yarn/**
            **/tests/**
            **/test/**
            **/phpunit.xml
            **/.phpunit.cache
            **/.phpunit.result.cache
            **/*.test.*
            **/*.spec.*
            **/.DS_Store
            **/Thumbs.db
            **/.idea/**
            **/.vscode/**
            **/.fleet/**
            **/.zed/**
            **/*.sql
            **/public/eski/**
            **/public/demo/**
            **/public/build/**
            **/public/hot
            **/.editorconfig
            **/Homestead.json
            **/Homestead.yaml
            **/auth.json
            **/.phpactor.json

      - name: Deployment Summary
        if: success()
        run: |
          echo "✅ Deployment completed successfully!"
          echo "🚀 Files deployed to cPanel"
          echo "📅 Deployment time: $(date)"

      - name: Deployment Failed Notification
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Please check the logs above for details."
          exit 1
